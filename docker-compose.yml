services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      MYPRODUCTCARE_DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - productcare-data:/app/data
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
volumes:
  productcare-data:
